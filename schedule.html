<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Self-hosted CRM система для медицинских клиник - управление пациентами, записями, расписанием врачей">
    <meta name="keywords"
        content="медицинская CRM, управление клиникой, записи пациентов, расписание врачей, медицинская администрация">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Медицинская CRM - Расписание</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="js/vue/schedule-app.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="l-main">
        <div class="l-content-wrapper">
            <div class="l-main-content">
                <section class="m-section">
                    <h2>Расписание и календарь</h2>

                    <div id="schedule-app">
                        <div class="m-schedule-controls" style="margin-bottom: 1.5rem;">
                            <label>
                                Филиал:
                                <select v-model="currentBranchId" class="m-select is-focusable">
                                    <option v-for="branch in branches" :key="branch.id" :value="branch.id">
                                        {{ branch.name }}
                                    </option>
                                </select>
                            </label>
                            <label>
                                Дата:
                                <input type="date" v-model="currentDate" class="m-input is-focusable">
                            </label>
                        </div>

                        <div id="schedule-content">
                            <div v-if="loading" class="m-preloader">Загрузка...</div>
                            <div v-else-if="error" class="m-error-message">{{ error }}</div>
                            <div v-else-if="appointments.length === 0">
                                <p>На выбранную дату нет записей</p>
                            </div>
                            <div v-else>
                                <h3>Записи на {{ formatDateFull(currentDate) }}</h3>
                                <div v-for="apt in appointments" :key="apt.id" class="m-schedule-slot" :data-appointment-id="apt.id">
                                    <div class="m-schedule-slot-time">{{ formatTime(apt.start) }}</div>
                                    <div class="m-schedule-slot-content">
                                        <div class="m-schedule-slot-patient">{{ apt.patient?.fullName || 'Пациент не указан' }}</div>
                                        <div class="m-schedule-slot-status" :class="'m-status-' + apt.status.toLowerCase()">
                                            {{ getStatusText(apt.status) }}
                                        </div>
                                        <div class="m-schedule-slot-icons" v-html="apt.patient?.iconsEmoji || ''"></div>
                                    </div>
                                    <a :href="'appointment-detail.html?id=' + apt.id" class="m-schedule-slot-link">Открыть</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="sidebar-placeholder"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
