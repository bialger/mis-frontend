<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Self-hosted CRM система для медицинских клиник - управление пациентами, записями, расписанием врачей">
    <meta name="keywords"
        content="медицинская CRM, управление клиникой, записи пациентов, расписание врачей, медицинская администрация">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Медицинская CRM - Настройки</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="js/vue/settings-app.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="l-main">
        <div class="l-content-wrapper">
            <div class="l-main-content">
                <section class="m-section">
                    <h2>Настройки системы</h2>
                    <div id="settings-app">
                        <div class="m-grid m-grid--reports">
                        <article class="m-card is-hoverable">
                            <h3>Общие настройки</h3>
                            <ul>
                                <li>Название клиники</li>
                                <li>Контактная информация</li>
                                <li>Часовой пояс</li>
                                <li>Язык интерфейса</li>
                            </ul>
                        </article>
                        <article class="m-card is-hoverable">
                            <h3>Параметры безопасности</h3>
                            <ul>
                                <li>Политика паролей</li>
                                <li>Двухфакторная аутентификация</li>
                                <li>Резервное копирование</li>
                                <li>Логирование действий</li>
                            </ul>
                        </article>
                        </div>
                    </div>
                </section>
            </div>

            <div id="sidebar-placeholder"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
