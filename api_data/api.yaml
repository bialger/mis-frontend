openapi: 3.1.0

info:
  title: MIS API
  version: 1.0.0
  description: >
    API медицинской информационной системы (self-hosted).
    Контракт для фронтенда (RBAC, расписание, пациенты, визиты, склад).

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Me
  - name: Schedule
  - name: Appointments
  - name: Patients
  - name: MedicalRecords
  - name: Files
  - name: Inventory
  - name: Reports
  - name: Settings
  - name: Audit

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              examples: [FORBIDDEN, NOT_FOUND, VALIDATION_ERROR]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
      required: [error]

    CursorPage:
      type: object
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [ADMIN, DOCTOR, HEAD, SYSADMIN] }

    Permissions:
      type: object
      properties:
        canViewFinance: { type: boolean }
        canEditFinance: { type: boolean }
        canViewInventory: { type: boolean }
        canWriteInventory: { type: boolean }
        canManualEgiszSend: { type: boolean }
        canEditBackdateDays: { type: integer }

    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        branchScope:
          type: array
          items: { type: integer }
        permissions:
          $ref: "#/components/schemas/Permissions"

    AppointmentStatus:
      type: string
      enum: [BOOKED, CONFIRMED, ARRIVED, NO_SHOW, CANCELED]

    PaymentFlags:
      type: object
      properties:
        noCashbox: { type: boolean }
        payLater: { type: boolean }
        partial: { type: boolean }

    Appointment:
      type: object
      properties:
        id: { type: integer }
        branchId: { type: integer }
        doctorId: { type: integer }
        roomId: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        source:
          type: string
          enum: [FRONT_DESK, ONLINE]
        patient:
          type: object
          properties:
            id: { type: integer }
            fullName: { type: string }
            phone: { type: string }
            icons:
              type: array
              items: { type: string }
        payment:
          type: object
          properties:
            total: { type: number }
            paid: { type: number }
            method:
              type: string
              nullable: true
            flags:
              $ref: "#/components/schemas/PaymentFlags"

    Patient:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        dob: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [MALE, FEMALE], nullable: true }
        cardNumber: { type: string, nullable: true }
        cardCreatedAt: { type: string, format: date-time, nullable: true }
        organizationName: { type: string, nullable: true }
        organizationCode: { type: string, nullable: true }
        organizationAddress: { type: string, nullable: true }
        registrationAddress: { type: object, nullable: true }
        residenceAddress: { type: object, nullable: true }
        localityType: { type: string, enum: [URBAN, RURAL], nullable: true }
        citizenship: { type: string, nullable: true }
        identityDocument: { type: object, nullable: true }
        omsPolicy: { type: string, nullable: true }
        omsSeries: { type: string, nullable: true }
        snils: { type: string, nullable: true }
        insuranceCompany: { type: string, nullable: true }
        guardian: { type: object, nullable: true }
        profession: { type: string, nullable: true }
        workplace: { type: string, nullable: true }
        icons:
          type: array
          items: { type: string }
        consents: { type: array, items: { type: object }, nullable: true }
        visitCount: { type: integer, default: 0 }
        lastVisitAt: { type: string, format: date-time, nullable: true }

    MedicalRecord:
      type: object
      properties:
        appointmentId: { type: integer }
        locked: { type: boolean }
        lockReason: { type: string, nullable: true }
        sections:
          type: object
          properties:
            complaints: { type: string }
            anamnesis: { type: string }
            examination: { type: string }
            diagnoses:
              type: array
              items:
                type: object
                properties:
                  text: { type: string }
                  code: { type: string }
            orders: { type: string }
            procedures: { type: string }
            epicrisis: { type: string }
        signature:
          type: object
          properties:
            status:
              type: string
              enum: [NOT_SIGNED, SIGNED]
            signedAt:
              type: string
              format: date-time
              nullable: true
            signedBy:
              type: integer
              nullable: true

    InventoryItem:
      type: object
      properties:
        id: { type: integer }
        branchId: { type: integer }
        name: { type: string }
        category:
          type: string
          enum: [DRUGS, MED_DEVICES, MED_CONSUMABLES, HOUSEHOLD_CONSUMABLES]
        unit: { type: string }
        stock: { type: number }
        minStock: { type: number }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string }
                password: { type: string }
              required: [login, password]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  user:
                    $ref: "#/components/schemas/User"

  /me:
    get:
      tags: [Me]
      summary: Current user + permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /appointments:
    get:
      tags: [Appointments]
      summary: Get appointments (schedule)
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"

    post:
      tags: [Appointments]
      summary: Create appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branchId: { type: integer }
                doctorId: { type: integer }
                roomId: { type: integer }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                patientId: { type: integer }
              required: [branchId, doctorId, start, end, patientId]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Appointment details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/status:
    post:
      tags: [Appointments]
      summary: Change appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/AppointmentStatus"
              required: [status]
      responses:
        "200":
          description: OK

  /appointments/{id}/medical-record:
    get:
      tags: [MedicalRecords]
      summary: Get medical record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"

    put:
      tags: [MedicalRecords]
      summary: Save medical record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalRecord"
      responses:
        "200":
          description: OK

  /appointments/{id}/payment:
    put:
      tags: [Appointments]
      summary: Update payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                total: { type: number }
                paid: { type: number }
                method: { type: string, nullable: true }
                flags:
                  $ref: "#/components/schemas/PaymentFlags"
      responses:
        "200":
          description: OK

  /appointments/{id}/status-history:
    get:
      tags: [Appointments]
      summary: Get status change history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: { $ref: "#/components/schemas/AppointmentStatus" }
                    changedAt: { type: string, format: date-time }
                    changedBy: { type: integer }

  /templates:
    get:
      tags: [MedicalRecords]
      summary: Get templates
      parameters:
        - name: specialty
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    specialty: { type: string, nullable: true }
                    sections: { type: object }

    post:
      tags: [MedicalRecords]
      summary: Save template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                specialty: { type: string, nullable: true }
                sections: { type: object }
      responses:
        "201":
          description: Created

  /files:
    get:
      tags: [Files]
      summary: Get files
      parameters:
        - name: entityType
          in: query
          required: true
          schema: { type: string, enum: [APPOINTMENT, PATIENT] }
        - name: entityId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    title: { type: string }
                    kind: { type: string }
                    size: { type: integer }
                    createdAt: { type: string, format: date-time }
                    createdBy: { type: integer }
                    downloadUrl: { type: string }
                    previewUrl: { type: string }

    post:
      tags: [Files]
      summary: Upload file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                entityType: { type: string }
                entityId: { type: integer }
      responses:
        "201":
          description: Created

  /files/{id}:
    delete:
      tags: [Files]
      summary: Delete file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /files/{id}/download:
    get:
      tags: [Files]
      summary: Download file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /files/{id}/preview:
    get:
      tags: [Files]
      summary: Preview file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /appointments/{id}/sign:
    post:
      tags: [MedicalRecords]
      summary: Sign medical record (ЭЦП)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /appointments/{id}/egisz-send:
    post:
      tags: [MedicalRecords]
      summary: Send to ЕГИСЗ
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /patients:
    get:
      tags: [Patients]
      summary: Search patients
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"

    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                phone: { type: string }
              required: [fullName, phone]
      responses:
        "201":
          description: Created

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient details (form 025-У)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

    put:
      tags: [Patients]
      summary: Update patient (form 025-У)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Patient"
      responses:
        "200":
          description: OK

  /patients/{id}/icons:
    post:
      tags: [Patients]
      summary: Add/remove patient icon
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iconId: { type: string }
                action: { type: string, enum: [ADD, REMOVE] }
      responses:
        "200":
          description: OK

  /inventory/items:
    get:
      tags: [Inventory]
      summary: Inventory list
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /audit:
    get:
      tags: [Audit]
      summary: Audit log
      parameters:
        - name: entityId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPage"
