<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Self-hosted CRM система для медицинских клиник - управление пациентами, записями, расписанием врачей">
    <meta name="keywords"
        content="медицинская CRM, управление клиникой, записи пациентов, расписание врачей, медицинская администрация">
    <title>Медицинская CRM - Пациенты</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/patients.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="l-main">
        <div class="l-content-wrapper">
            <div class="l-main-content">
                <section class="m-section">
                    <h2>Управление пациентами</h2>

                    <div class="m-patients-search" style="margin-bottom: 1.5rem;">
                        <input type="text" id="patient-search" class="m-input is-focusable"
                            placeholder="Поиск по ФИО или телефону..."
                            style="width: 100%; max-width: 400px; margin-right: 1rem;">
                        <button id="search-btn" class="m-button is-hoverable-button">Поиск</button>
                        <button id="create-patient-btn" class="m-button is-hoverable-button">Создать пациента</button>
                    </div>

                    <div id="patients-content">
                        <p>Введите поисковый запрос для поиска пациентов</p>
                    </div>


                    <template id="patient-item-template">
                        <article class="m-patient-card is-hoverable" data-patient-id="">
                            <div class="m-patient-header">
                                <h3 class="m-patient-name"></h3>
                                <div class="m-patient-icons"></div>
                            </div>
                            <div class="m-patient-info">
                                <p class="m-patient-phone"></p>
                                <p class="m-patient-dob"></p>
                            </div>
                            <div class="m-patient-actions">
                                <a href="#" class="m-button m-button--view is-hoverable-button">Открыть карточку</a>
                            </div>
                        </article>
                    </template>
                </section>
            </div>

            <div id="sidebar-placeholder"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
