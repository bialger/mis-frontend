<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Self-hosted CRM система для медицинских клиник - управление пациентами, записями, расписанием врачей">
    <meta name="keywords"
        content="медицинская CRM, управление клиникой, записи пациентов, расписание врачей, медицинская администрация">
    <title>Медицинская CRM - Пациенты</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="js/vue/patients-app.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="l-main">
        <div class="l-content-wrapper">
            <div class="l-main-content">
                <section class="m-section">
                    <h2>Управление пациентами</h2>

                    <div id="patients-app">
                        <div class="m-patients-search" style="margin-bottom: 1.5rem;">
                            <input type="text" v-model="searchQuery" @keyup.enter="searchPatients()" 
                                class="m-input is-focusable" placeholder="Поиск по ФИО или телефону..."
                                style="width: 100%; max-width: 400px; margin-right: 1rem;">
                            <button @click="searchPatients()" class="m-button is-hoverable-button">Поиск</button>
                            <button @click="createPatient()" class="m-button is-hoverable-button">Создать пациента</button>
                        </div>

                        <div id="patients-content">
                            <div v-if="loading" class="m-preloader">Загрузка...</div>
                            <div v-else-if="error" class="m-error-message">{{ error }}</div>
                            <div v-else-if="patients.length === 0">
                                <p>Пациенты не найдены</p>
                            </div>
                            <div v-else>
                                <h3>Найдено пациентов: {{ patients.length }}</h3>
                                <div class="m-patients-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-top: 1rem;">
                                    <article v-for="patient in patients" :key="patient.id" 
                                        class="m-patient-card is-hoverable" :data-patient-id="patient.id">
                                        <div class="m-patient-header">
                                            <h3 class="m-patient-name">{{ patient.fullName || 'Без имени' }}</h3>
                                            <div class="m-patient-icons" v-html="patient.iconsEmoji || ''"></div>
                                        </div>
                                        <div class="m-patient-info">
                                            <p class="m-patient-phone">Телефон: {{ patient.phone || 'не указан' }}</p>
                                            <p v-if="patient.dob" class="m-patient-dob">Дата рождения: {{ formatDate(patient.dob) }}</p>
                                        </div>
                                        <div class="m-patient-actions">
                                            <a :href="'patient-detail.html?id=' + patient.id" 
                                                class="m-button m-button--view is-hoverable-button">Открыть карточку</a>
                                        </div>
                                    </article>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="sidebar-placeholder"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
