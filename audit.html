<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Self-hosted CRM система для медицинских клиник - управление пациентами, записями, расписанием врачей">
    <meta name="keywords"
        content="медицинская CRM, управление клиникой, записи пациентов, расписание врачей, медицинская администрация">
    <title>Медицинская CRM - Логи действий</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/audit.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="l-main">
        <div class="l-content-wrapper">
            <div class="l-main-content">
                <section class="m-section">
                    <h2>Логи действий (Аудит)</h2>
                    
                    <div class="m-audit-controls" style="margin-bottom: 1.5rem;">
                        <label>
                            Фильтр по сущности:
                            <select id="entity-type-filter" class="m-select is-focusable">
                                <option value="">Все сущности</option>
                                <option value="APPOINTMENT">Записи</option>
                                <option value="PATIENT">Пациенты</option>
                                <option value="INVENTORY">Склад</option>
                                <option value="USER">Пользователи</option>
                            </select>
                        </label>
                        <label>
                            Период с:
                            <input type="date" id="audit-date-from" class="m-input is-focusable">
                        </label>
                        <label>
                            Период по:
                            <input type="date" id="audit-date-to" class="m-input is-focusable">
                        </label>
                        <button id="load-audit-btn" class="m-button is-hoverable-button">Загрузить</button>
                    </div>
                    
                    <div id="audit-content">
                        <p>Загрузка логов...</p>
                    </div>
                </section>
            </div>

            <div id="sidebar-placeholder"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
